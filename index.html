<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PetCare — здоровье и забота о питомцах">
  <title>PetCare</title>
  <link rel="icon" type="image/jpeg" href="petcare-icon.jpg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <main id="auth-screen" class="auth-layout">
    <section class="brand-panel"><div class="brand-mark"><img src="petcare-icon.jpg" alt=""></div></section>
    <section class="form-panel"><div class="auth-card">
      <div class="mobile-brand"><img src="petcare-icon.jpg" alt=""></div>
      <div id="auth-view"><div class="card-heading"><h2 id="form-title">Войти</h2></div><div class="tabs"><button class="tab is-active" data-mode="login" type="button">Войти</button><button class="tab" data-mode="register" type="button">Регистрация</button></div><div id="auth-message" class="message" role="alert"></div><form id="auth-form" novalidate><div id="name-field" class="field is-hidden"><label for="auth-name">Имя</label><input id="auth-name" name="name" type="text" autocomplete="name"></div><div class="field"><label for="auth-email">Email</label><input id="auth-email" name="email" type="email" autocomplete="email"></div><div class="field"><label for="auth-password">Пароль</label><div class="password-wrap"><input id="auth-password" name="passwd" type="password" autocomplete="current-password"><button class="password-toggle" type="button">Показать</button></div></div><button id="auth-submit" class="primary-button" type="submit">Войти</button></form><p id="auth-hint" class="mock-hint"></p></div>
      <div id="test-login" class="test-login"><h3>Быстрый вход для презентации</h3><div class="field"><label for="test-account">Тестовый аккаунт</label><select id="test-account"><option value="0">root1 — example1@mail.ru</option><option value="1">root2 — 2@example.ru</option><option value="2">root3 — 3@example.ru</option><option value="3">root4 — 4@example.ru</option><option value="4">root5 — 5@example.ru</option><option value="5">root6 — 1@example.ru</option><option value="6">root7 — example7@mail.ru</option><option value="7">root8 — example8@mail.ru</option><option value="8">root9 — example9@mail.ru</option><option value="9">root10 — example10@mail.ru</option></select></div><button id="test-login-button" class="secondary-button" type="button">Войти в тестовый аккаунт</button></div>
      <div id="verify-view" class="is-hidden"><button id="back-to-auth" class="back-button" type="button">← Назад</button><div class="card-heading"><h2>Введите код</h2><p class="muted">Код отправлен на <strong id="verify-email"></strong></p></div><div id="verify-message" class="message"></div><form id="verify-form" novalidate><div class="field"><label for="verify-code">Код подтверждения</label><input id="verify-code" class="code-input" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div><button class="primary-button" type="submit">Подтвердить</button></form><button id="resend-button" class="secondary-button" type="button">Отправить код ещё раз</button><p id="resend-status" class="resend-status"></p></div>
    </div></section>
  </main>
  <main id="app-screen" class="app-shell is-hidden"><aside class="sidebar"><button class="sidebar-logo" type="button" data-page="dashboard" title="Обзор"><img src="petcare-icon.jpg" alt=""><span>PetCare</span></button><nav><button class="nav-link is-active" data-page="dashboard"><svg class="svg-icon"><use href="icons.svg#home"></use></svg><span>Обзор</span></button><button class="nav-link" data-page="pets"><svg class="svg-icon"><use href="icons.svg#paw"></use></svg><span>Мои питомцы</span></button><button class="nav-link" data-page="health"><svg class="svg-icon"><use href="icons.svg#heart"></use></svg><span>Карта здоровья</span></button><button class="nav-link" data-page="food"><svg class="svg-icon"><use href="icons.svg#bowl"></use></svg><span>Питание</span></button><button class="nav-link" data-page="reminders"><svg class="svg-icon"><use href="icons.svg#bell"></use></svg><span>Напоминания</span></button></nav><button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Свернуть панель"><b aria-hidden="true">«</b> <span>Свернуть</span></button></aside><section class="app-content"><header class="topbar"><div><h1 id="page-title">Обзор</h1></div><div class="topbar-actions"><button id="bell-button" class="bell-button" type="button" aria-label="Уведомления"><svg class="svg-icon"><use href="icons.svg#bell"></use></svg><span id="bell-count" class="bell-count is-hidden">0</span></button><div class="user-menu-wrap"><button id="user-menu-button" class="user-chip" type="button" title="Аккаунт" aria-haspopup="menu" aria-expanded="false"><span id="user-initial">А</span><span id="user-name">Пользователь</span></button><div id="user-menu" class="user-menu is-hidden" role="menu"><div class="user-menu-head"><strong id="menu-user-name"></strong><small id="menu-user-email"></small></div><button class="user-menu-item" type="button" role="menuitem" data-page="profile"><svg class="svg-icon"><use href="icons.svg#user"></use></svg> &#1040;&#1082;&#1082;&#1072;&#1091;&#1085;&#1090;</button><button id="logout-button" class="user-menu-item danger" type="button" role="menuitem"><svg class="svg-icon"><use href="icons.svg#logout"></use></svg> &#1042;&#1099;&#1081;&#1090;&#1080;</button></div></div></div></header><div id="app-message" class="message"></div><div id="page-content"></div></section></main>
  <div id="modal" class="modal is-hidden"><div class="modal-backdrop" data-close-modal></div><div class="modal-card" role="dialog" aria-modal="true"><button class="modal-close" type="button" data-close-modal aria-label="Закрыть">×</button><div id="modal-content"></div></div></div>
  <script src="script.js"></script>
</body>
</html>
