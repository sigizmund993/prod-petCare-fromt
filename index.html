<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PetCare — здоровье и забота о питомцах">
  <title>PetCare</title>
  <link rel="icon" type="image/jpeg" href="petcare-icon.jpg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <main id="auth-screen" class="auth-layout">
    <section class="brand-panel"><div class="brand-mark"><img src="petcare-icon.jpg" alt=""></div></section>
    <section class="form-panel"><div class="auth-card">
      <div class="mobile-brand"><img src="petcare-icon.jpg" alt=""></div>
      <div id="auth-view"><div class="card-heading"><h2 id="form-title">Войти</h2></div><div class="tabs"><button class="tab is-active" data-mode="login" type="button">Войти</button><button class="tab" data-mode="register" type="button">Регистрация</button></div><div id="auth-message" class="message" role="alert"></div><form id="auth-form" novalidate><div id="name-field" class="field is-hidden"><label for="auth-name">Имя</label><input id="auth-name" type="text"></div><div class="field"><label for="auth-email">Email</label><input id="auth-email" type="email" autocomplete="email" required></div><div class="field"><label for="auth-password">Пароль</label><div class="password-wrap"><input id="auth-password" type="password" autocomplete="current-password" required><button class="password-toggle" type="button">Показать</button></div></div><label id="terms-field" class="checkbox-row is-hidden"><input id="terms" type="checkbox"><span>Я принимаю условия использования PetCare</span></label><button id="auth-submit" class="primary-button" type="submit">Войти</button></form><p id="auth-hint" class="mock-hint"></p></div>
      <div id="verify-view" class="is-hidden"><button id="back-to-auth" class="back-button" type="button">← Назад</button><div class="card-heading"><h2>Введите код</h2><p class="muted">Код отправлен на <strong id="verify-email"></strong></p></div><div id="verify-message" class="message"></div><form id="verify-form"><div class="field"><label for="verify-code">Код подтверждения</label><input id="verify-code" class="code-input" inputmode="numeric" maxlength="6"></div><button class="primary-button" type="submit">Подтвердить</button></form><button id="resend-button" class="secondary-button" type="button">Отправить код ещё раз</button><p id="resend-status" class="resend-status"></p></div>
    </div><p class="copyright">© 2026 PetCare</p></section>
  </main>
  <main id="app-screen" class="app-shell is-hidden"><aside class="sidebar"><div class="sidebar-logo"><img src="petcare-icon.jpg" alt=""><span>PetCare</span></div><nav><button class="nav-link is-active" data-page="dashboard">⌂ <span>Обзор</span></button><button class="nav-link" data-page="procedures">✓ <span>Процедуры</span></button><button class="nav-link" data-page="pets">🐾 <span>Питомцы</span></button><button class="nav-link" data-page="food">● <span>Питание</span></button><button class="nav-link" data-page="profile">👤 <span>Аккаунт</span></button></nav><button id="logout-button" class="logout-link">↪ <span>Выйти</span></button></aside><section class="app-content"><header class="topbar"><div><h1 id="page-title">Обзор</h1></div><div class="user-chip"><span id="user-initial">А</span><span id="user-name">Пользователь</span></div></header><div id="app-message" class="message"></div><div id="page-content"></div></section></main>
  <div id="modal" class="modal is-hidden"><div class="modal-backdrop" data-close-modal></div><div class="modal-card"><button class="modal-close" data-close-modal>×</button><div id="modal-content"></div></div></div>
  <script src="script.js"></script>
</body>
</html>
