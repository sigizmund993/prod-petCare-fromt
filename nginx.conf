# HTTP только перенаправляет на HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://hack-led-19-vm1-fe90ec.vmaas-spirit.t-education.com$request_uri;
}

# Сертификат Let's Encrypt выпускает certbot на ВМ, контейнер монтирует /etc/letsencrypt (см. README, раздел HTTPS)
server {
    listen 443 ssl;
    http2 on;
    server_name hack-led-19-vm1-fe90ec.vmaas-spirit.t-education.com;

    ssl_certificate     /etc/letsencrypt/live/hack-led-19-vm1-fe90ec.vmaas-spirit.t-education.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hack-led-19-vm1-fe90ec.vmaas-spirit.t-education.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://app:8080;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
