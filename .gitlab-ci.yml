stages:
  - test
  - build
  - deploy

variables:
  APP_NAME: petcare-frontend
  APP_FILES: "index.html style.css script.js petcare-icon.jpg icons.svg Dockerfile nginx.conf"
  # Домен ВМ, который выдал Spirit (карточка ВМ → FQDN). Он же прописан в nginx.conf
  DOMAIN: hack-led-19-vm1-fe90ec.vmaas-spirit.t-education.com

lint:
  stage: test
  image: node:20-alpine
  script:
    - echo "Проверяем синтаксис JavaScript"
    - node --check script.js
    - echo "Проверяем, что все файлы на месте"
    - for f in $APP_FILES; do test -f "$f" || { echo "Нет файла $f"; exit 1; }; done

frontend-tests:
  stage: test
  image: alpine:3.20
  before_script:
    - apk add --no-cache chromium python3 font-noto
  script:
    # Тесты работают в демо-режиме (?demo=1), бэкенд не нужен. Сайт должен открываться с localhost
    - python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &
    - sleep 2
    - >
      chromium-browser --headless --no-sandbox --disable-gpu --disable-dev-shm-usage
      --window-size=1400,1000 --virtual-time-budget=180000
      --dump-dom "http://127.0.0.1:8000/test/index.html" > test-report.html 2>/dev/null
    - grep -o '<span id="summary">[^<]*' test-report.html | sed 's/<[^>]*>//' || true
    # Упавшие тесты с причиной
    - grep -o '<li class="fail">[^<]*<small>[^<]*' test-report.html | sed 's/<[^>]*>/ — /g' || true
    # tests.js ставит заголовок страницы PASS/FAIL, когда все тесты отработали
    - grep -q '<title>PASS' test-report.html || { echo "Тесты фронтенда не прошли"; exit 1; }
  artifacts:
    when: always
    paths:
      - test-report.html
    expire_in: 1 week

build:
  stage: build
  image: alpine:3.20
  script:
    - mkdir -p dist
    - cp $APP_FILES dist/
    - ls -la dist
  artifacts:
    paths:
      - dist/
    expire_in: 1 day

deploy:
  stage: deploy
  image: alpine:3.20
  needs: [build]
  environment: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache openssh-client
    - chmod 600 "$DEPLOY_KEY"
    - SSH_OPTS="-i $DEPLOY_KEY -o StrictHostKeyChecking=no"
  script:
    # Без сертификата nginx не запустится и сайт ляжет, поэтому старый контейнер не трогаем
    - |
      ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "sudo test -f /etc/letsencrypt/live/$DOMAIN/fullchain.pem" || {
        echo "На ВМ нет сертификата для $DOMAIN. Выпустите его certbot (README, раздел HTTPS) и перезапустите деплой"; exit 1; }
    - ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf ~/$APP_NAME && mkdir -p ~/$APP_NAME"
    - scp $SSH_OPTS -r dist/. "$DEPLOY_USER@$DEPLOY_HOST:~/$APP_NAME/"
    - >
      ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST"
      "cd ~/$APP_NAME &&
      sudo docker build -t $APP_NAME . &&
      (sudo docker rm -f $APP_NAME || true) &&
      sudo docker run -d --name $APP_NAME --restart unless-stopped --network app_app_network
      -p 80:80 -p 443:443 -v /etc/letsencrypt:/etc/letsencrypt:ro $APP_NAME"
    - echo "Задеплоено на https://$DOMAIN"
